name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CLAUDE.md
      - docs/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy, build a integrace
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Nástroje
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: Kontrola syntaxe app.js
        run: node --check Packages/MarkdownCore/Sources/WebAssets/Resources/web/app.js

      - name: Testy jádra (renderer, golden testy proti GitHubu, watcher)
        run: make test

      - name: Build aplikace (Debug)
        run: make build

      - name: Integrační testy v aplikaci
        run: scripts/ci-integration.sh

      - name: Artefakty integračních testů
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrace
          path: |
            /tmp/mdview-ci.*/
            /tmp/mdview-selftest.*/
            /tmp/mdview-sim.*/
          if-no-files-found: ignore

      - name: Instalace a Quick Look
        run: |
          make install
          # Virtuální runner bez GPU je pomalý – v CI se ověřuje funkčnost, rychlost lokálně (500 ms).
          LIMIT_MS=15000 scripts/quicklook-check.sh
