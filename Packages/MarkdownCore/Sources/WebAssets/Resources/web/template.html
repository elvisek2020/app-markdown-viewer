<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>MDView</title>
<link rel="stylesheet" href="vendor/github-markdown-css/github-markdown.css">
<link rel="stylesheet" href="vendor/highlight.js/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/highlight.js/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="mdv-banner" role="status" hidden></div>
<div id="mdv-find-status" role="status" hidden></div>
<div id="mdv-panes">
  <div id="mdv-source-scroll" tabindex="-1" aria-label="Zdroj"><div id="mdv-source"></div></div>
  <div id="mdv-divider" role="separator" aria-orientation="vertical"></div>
  <div id="mdv-scroll" tabindex="-1"><article id="mdv-content" class="markdown-body"></article></div>
</div>
</body>
</html>
